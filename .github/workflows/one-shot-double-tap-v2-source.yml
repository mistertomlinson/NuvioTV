name: One-shot Double Tap V2 Source Tune

on:
  push:
    branches:
      - tune-double-tap-scroll-v2

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply scroll tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          content_path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt')
          content = content_path.read_text()
          old_vertical = 'internal const val HOME_DOUBLE_UP_VELOCITY_DP_PER_SEC = 3200f'
          new_vertical = 'internal const val HOME_DOUBLE_UP_VELOCITY_DP_PER_SEC = 3000f'
          vertical_count = content.count(old_vertical)
          if vertical_count == 1:
              content_path.write_text(content.replace(old_vertical, new_vertical))
          elif new_vertical not in content:
              raise SystemExit(f'Unexpected vertical-speed state: old matches={vertical_count}')

          rows_path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeRows.kt')
          rows = rows_path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>[ \t]*)val isRegularPortraitCatalogRow =\n'
              r'[ \t]+!isNumbered &&\n'
              r'[ \t]+!useLandscapePosters &&\n'
              r'[ \t]+!perCatalogLandscape &&\n'
              r'[ \t]+!isCwRow\n\n'
              r'(?P=i)val targetPositionsPerSecond =\n'
              r'[ \t]+if \(\n'
              r'[ \t]+isRegularPortraitCatalogRow\n'
              r'[ \t]+\) \{\n'
              r'[ \t]+32f\n'
              r'[ \t]+\} else \{\n'
              r'[ \t]+20f\n'
              r'[ \t]+\}\n\n'
              r'(?P=i)val velocityPxPerSecond =\n'
              r'[ \t]+measuredPitchPx \*\n'
              r'[ \t]+targetPositionsPerSecond'
          )

          def replacement(match):
              i = match.group('i')
              return '\n'.join([
                  i + 'val isPortraitCatalogGeometry =',
                  i + '    !useLandscapePosters &&',
                  i + '        !perCatalogLandscape &&',
                  i + '        !isCwRow',
                  '',
                  i + 'val targetPositionsPerSecond =',
                  i + '    if (',
                  i + '        isPortraitCatalogGeometry',
                  i + '    ) {',
                  i + '        32f',
                  i + '    } else {',
                  i + '        20f',
                  i + '    }',
                  '',
                  i + '// Numbered rows deliberately use extra spacing for the',
                  i + '// large number overlay. Do not let that visual spacing',
                  i + '// inflate Double-Left screen velocity.',
                  i + 'val velocityPitchPx =',
                  i + '    if (isNumbered) {',
                  i + '        val numberedSpacingPx =',
                  i + '            with(doubleLeftDensity) {',
                  i + '                numberedRowSpacing.toPx()',
                  i + '            }',
                  i + '        val regularSpacingPx =',
                  i + '            with(doubleLeftDensity) {',
                  i + '                12.dp.toPx()',
                  i + '            }',
                  i + '        (',
                  i + '            measuredPitchPx -',
                  i + '                numberedSpacingPx +',
                  i + '                regularSpacingPx',
                  i + '        ).coerceAtLeast(1f)',
                  i + '    } else {',
                  i + '        measuredPitchPx',
                  i + '    }',
                  '',
                  i + 'val velocityPxPerSecond =',
                  i + '    velocityPitchPx *',
                  i + '        targetPositionsPerSecond',
              ])

          rows, horizontal_count = pattern.subn(replacement, rows)
          if horizontal_count == 1:
              rows_path.write_text(rows)
          elif not (
              rows.count('val isPortraitCatalogGeometry =') == 1 and
              rows.count('val velocityPitchPx =') == 1
          ):
              raise SystemExit(
                  f'Unexpected horizontal-speed state: matches={horizontal_count}, '
                  f'geometry={rows.count("val isPortraitCatalogGeometry =")}, '
                  f'pitch={rows.count("val velocityPitchPx =")}'
              )
          PY

      - name: Commit tuning if needed
        run: |
          if git diff --quiet; then
            echo "Tuning already applied; nothing to commit."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt \
                  app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeRows.kt
          git commit -m "Refine double-tap scroll tuning"
          git push origin HEAD:tune-double-tap-scroll-v2
