name: One-shot Fix Numbered Left And Up 2400

on:
  push:
    branches:
      - fix-numbered-double-left-and-up-2400

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply tuning fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          content_path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt')
          content = content_path.read_text()
          old_up = 'internal const val HOME_DOUBLE_UP_VELOCITY_DP_PER_SEC = 2800f'
          new_up = 'internal const val HOME_DOUBLE_UP_VELOCITY_DP_PER_SEC = 2400f'
          if content.count(old_up) != 1:
              raise SystemExit(f'Expected exactly one 2800f Double-Up constant, found {content.count(old_up)}')
          content_path.write_text(content.replace(old_up, new_up))

          rows_path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeRows.kt')
          rows = rows_path.read_text()
          old_name = 'val isPortraitCatalogGeometry ='
          new_name = 'val isRegularPortraitCatalogRow ='
          if rows.count(old_name) != 1:
              raise SystemExit(f'Expected exactly one portrait geometry declaration, found {rows.count(old_name)}')
          rows = rows.replace(old_name, new_name)

          old_first_condition = '                                                        !useLandscapePosters &&'
          new_first_condition = '                                                        !isNumbered &&\n                                                            !useLandscapePosters &&'
          marker = 'val isRegularPortraitCatalogRow =\n' + old_first_condition
          if rows.count(marker) != 1:
              raise SystemExit(f'Expected exactly one numbered-rate insertion point, found {rows.count(marker)}')
          rows = rows.replace(marker, 'val isRegularPortraitCatalogRow =\n' + new_first_condition)

          old_ref = '                                                            isPortraitCatalogGeometry'
          new_ref = '                                                            isRegularPortraitCatalogRow'
          if rows.count(old_ref) != 1:
              raise SystemExit(f'Expected exactly one portrait geometry reference, found {rows.count(old_ref)}')
          rows = rows.replace(old_ref, new_ref)
          rows_path.write_text(rows)
          PY

      - name: Commit fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt \
                  app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeRows.kt
          git commit -m "Restore Double-Up 2400 and fix numbered-row Double-Left rate"
          git push origin HEAD:fix-numbered-double-left-and-up-2400
