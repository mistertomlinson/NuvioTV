name: One-shot Fix Numbered Left And Up 2400

on:
  push:
    branches:
      - fix-numbered-double-left-and-up-2400

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply tuning fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          content_path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt')
          content = content_path.read_text()
          old_up = 'internal const val HOME_DOUBLE_UP_VELOCITY_DP_PER_SEC = 2800f'
          new_up = 'internal const val HOME_DOUBLE_UP_VELOCITY_DP_PER_SEC = 2400f'
          if content.count(old_up) != 1:
              raise SystemExit(f'Expected exactly one 2800f Double-Up constant, found {content.count(old_up)}')
          content_path.write_text(content.replace(old_up, new_up))

          rows_path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeRows.kt')
          rows = rows_path.read_text()
          old_block = '''                                                    val isPortraitCatalogGeometry =
                                                        !useLandscapePosters &&
                                                            !perCatalogLandscape &&
                                                            !isCwRow

                                                    val targetPositionsPerSecond =
                                                        if (
                                                            isPortraitCatalogGeometry
                                                        ) {
                                                            32f
                                                        } else {
                                                            20f
                                                        }
'''
          new_block = '''                                                    val isRegularPortraitCatalogRow =
                                                        !isNumbered &&
                                                            !useLandscapePosters &&
                                                            !perCatalogLandscape &&
                                                            !isCwRow

                                                    val targetPositionsPerSecond =
                                                        if (
                                                            isRegularPortraitCatalogRow
                                                        ) {
                                                            32f
                                                        } else {
                                                            20f
                                                        }
'''
          if rows.count(old_block) != 1:
              raise SystemExit(f'Expected exactly one portrait-rate block, found {rows.count(old_block)}')
          rows_path.write_text(rows.replace(old_block, new_block))
          PY

      - name: Commit fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt \
                  app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeRows.kt
          git commit -m "Restore Double-Up 2400 and fix numbered-row Double-Left rate"
          git push origin HEAD:fix-numbered-double-left-and-up-2400
