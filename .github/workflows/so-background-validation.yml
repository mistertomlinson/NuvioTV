name: Streaming Originals background refresh validation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'app/src/main/java/com/nuvio/tv/core/reminders/**'
      - 'app/src/main/java/com/nuvio/tv/ui/screens/home/**'
      - 'app/src/main/java/com/nuvio/tv/MainActivity.kt'
      - 'app/src/main/java/com/nuvio/tv/NuvioApplication.kt'
      - 'app/src/test/java/com/nuvio/tv/core/reminders/**'
      - '.github/workflows/so-background-validation.yml'

permissions:
  contents: read

jobs:
  unit-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and run focused tests (no production signing or deployment)
        run: |
          chmod +x gradlew
          ./gradlew :app:testSideloadUnitTest --tests '*StreamingOriginalsRefreshSlotTest*' --tests '*ReleaseReminder*' --console=plain
          ./gradlew :app:compileSideloadKotlin --console=plain
