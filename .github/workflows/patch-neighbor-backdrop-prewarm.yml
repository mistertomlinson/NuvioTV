name: Patch same-row hero backdrop prewarm

on:
  push:
    branches:
      - fix/readiness-gated-hero-backdrop
    paths:
      - .github/workflows/patch-neighbor-backdrop-prewarm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/readiness-gated-hero-backdrop

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Replace readiness gate with immediate same-row neighbor prewarm
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hero_path = Path("app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeHero.kt")
          hero = hero_path.read_text()

          gate_start_marker = "    /*\n     * Keep Backdrop A visible until the currently focused Backdrop B has"
          gate_end_marker = "    Box(modifier = modifier.clipToBounds()) {"
          gate_start = hero.find(gate_start_marker)
          if gate_start < 0:
              raise SystemExit("Readiness gate start marker not found")
          gate_end = hero.find(gate_end_marker, gate_start)
          if gate_end < 0:
              raise SystemExit("Readiness gate end marker not found")

          hero = hero[:gate_start] + hero[gate_end:]
          old_target = "            targetState = displayedBackdropFrame,"
          new_target = "            targetState = targetBackdropFrame,"
          if hero.count(old_target) != 1:
              raise SystemExit(f"Expected one readiness-gated Crossfade target, found {hero.count(old_target)}")
          hero = hero.replace(old_target, new_target, 1)
          hero_path.write_text(hero)

          content_path = Path("app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt")
          content = content_path.read_text()

          anchor = "        // Speculative hero images are warmed only after navigation settles."
          anchor_pos = content.find(anchor)
          if anchor_pos < 0:
              raise SystemExit("Hero prewarm anchor not found")

          effect_start_marker = "        LaunchedEffect(heroMediaWidthPx, heroMediaHeightPx) {\n            if (heroMediaWidthPx <= 0 || heroMediaHeightPx <= 0) return@LaunchedEffect"
          effect_start = content.find(effect_start_marker, anchor_pos)
          if effect_start < 0:
              raise SystemExit("Existing hero prewarm effect start not found")

          effect_end_marker = "        LaunchedEffect(heroMediaWidthPx, heroMediaHeightPx) {\n            if (heroMediaWidthPx > 0 && heroMediaHeightPx > 0) {"
          effect_end = content.find(effect_end_marker, effect_start)
          if effect_end < 0:
              raise SystemExit("Existing hero prewarm effect end not found")

          replacement = r'''        /*
         * Immediate same-row hero backdrop prewarm.
         *
         * Keep only the two likely horizontal destinations warm: the item
         * immediately left and immediately right of the current focus. Requests
         * use the exact hero render size so Coil's memory-cache entry can be
         * reused directly by ModernHeroMediaLayer.
         *
         * Unlike the old four-direction warmup, this does not touch adjacent
         * rows. Vertical and held-DPAD scrolling cancel the work, while ordinary
         * horizontal focus changes start the two small speculative requests
         * immediately instead of waiting for an idle debounce.
         */
        LaunchedEffect(heroMediaWidthPx, heroMediaHeightPx) {
            if (heroMediaWidthPx <= 0 || heroMediaHeightPx <= 0) return@LaunchedEffect

            kotlinx.coroutines.flow.combine(
                snapshotFlow { activeRowKey to activeItemIndex },
                snapshotFlow { verticalRowListState.isScrollInProgress },
                isFastScrollingRef
            ) { selection, verticalScrolling, fastScrolling ->
                selection to (verticalScrolling || fastScrolling)
            }.collectLatest { (selection, blocked) ->
                if (blocked) return@collectLatest

                val (rowKey, index) = selection
                if (rowKey == null) return@collectLatest

                val row = latestCarouselRows.firstOrNull { it.key == rowKey }
                    ?: return@collectLatest

                val urls = listOfNotNull(
                    row.items.getOrNull(index - 1)?.heroPreview?.let {
                        firstNonBlank(it.backdrop, it.imageUrl)
                    },
                    row.items.getOrNull(index + 1)?.heroPreview?.let {
                        firstNonBlank(it.backdrop, it.imageUrl)
                    }
                )
                    .filter { it.isNotBlank() }
                    .distinct()

                kotlinx.coroutines.coroutineScope {
                    urls.forEach { url ->
                        launch {
                            try {
                                prewarmImageLoader.execute(
                                    coil.request.ImageRequest.Builder(context)
                                        .data(url)
                                        .crossfade(false)
                                        .size(
                                            width = heroMediaWidthPx,
                                            height = heroMediaHeightPx
                                        )
                                        .memoryCachePolicy(coil.request.CachePolicy.ENABLED)
                                        .build()
                                )
                            } catch (
                                cancelled: kotlinx.coroutines.CancellationException
                            ) {
                                throw cancelled
                            } catch (_: Throwable) {
                                // Best-effort prewarm must never affect Home.
                            }
                        }
                    }
                }
            }
        }
'''

          content = content[:effect_start] + replacement + content[effect_end:]

          old_comment = "        // Speculative hero images are warmed only after navigation settles.\n        // The displayed hero and cold-start request retain their existing paths."
          new_comment = "        // Hero neighbors are warmed at the exact render size; cold-start and\n        // platform-transition prewarm keep their existing specialized paths."
          if old_comment not in content:
              raise SystemExit("Expected prewarm summary comment not found")
          content = content.replace(old_comment, new_comment, 1)

          content_path.write_text(content)
          PY

          git diff --check
          git diff -- app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeHero.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt

      - name: Compile sideload Kotlin
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew :app:compileSideloadKotlin --stacktrace

      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-neighbor-backdrop-prewarm.yml
          git add app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeHero.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt \
            .github/workflows/patch-neighbor-backdrop-prewarm.yml
          git diff --cached --check
          git commit -m "Prewarm immediate Home hero backdrop neighbors"
          git push origin HEAD:fix/readiness-gated-hero-backdrop
