name: One-shot Double Tap Test APK

on:
  push:
    branches:
      - test-double-tap-scroll

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Build sideload APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSideload --no-daemon

      - name: Show APK outputs
        run: find app/build/outputs/apk/sideload -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload armeabi-v7a test APK
        uses: actions/upload-artifact@v4
        with:
          name: double-tap-test-armeabi-v7a
          path: app/build/outputs/apk/sideload/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 3
