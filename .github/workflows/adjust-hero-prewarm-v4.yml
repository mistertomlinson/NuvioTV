name: Adjust hero backdrop prewarm v4

on:
  push:
    branches:
      - fix/readiness-gated-hero-backdrop
    paths:
      - .github/workflows/adjust-hero-prewarm-v4.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/readiness-gated-hero-backdrop
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare local properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Keep only right and below hero prewarm targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt')
          lines = path.read_text().splitlines()

          marker = '* Keep four likely destinations warm: the item immediately left and'
          marker_index = next((i for i, line in enumerate(lines) if marker in line), None)
          if marker_index is None:
              raise SystemExit('Expected four-target comment marker not found')
          start = marker_index
          while start >= 0 and '/*' not in lines[start]:
              start -= 1
          end = marker_index
          while end < len(lines) and '*/' not in lines[end]:
              end += 1
          if start < 0 or end >= len(lines):
              raise SystemExit('Could not bound prewarm comment block')
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          new_comment = [
              indent + '/*',
              indent + ' * Immediate likely-destination hero backdrop prewarm.',
              indent + ' *',
              indent + ' * Keep only the two likely cold destinations warm: the item immediately',
              indent + ' * right of the current focus and the remembered-focus item in the row',
              indent + ' * immediately below (falling back to item 0). The left item and row above',
              indent + ' * are intentionally omitted because those destinations were already',
              indent + ' * visited and should normally already be warm in Coil\'s cache.',
              indent + ' *',
              indent + ' * Requests use the exact hero render size so Coil\'s memory-cache entry can',
              indent + ' * be reused directly by ModernHeroMediaLayer. Vertical and held-DPAD',
              indent + ' * scrolling cancel the work; no wider speculation is performed.',
              indent + ' */',
          ]
          lines[start:end + 1] = new_comment

          left_index = next((i for i, line in enumerate(lines) if 'row.items.getOrNull(index - 1)?.heroPreview?.let {' in line), None)
          if left_index is None:
              raise SystemExit('Expected left-neighbor prewarm block not found')
          left_end = left_index
          while left_end < len(lines) and '?.takeIf { it.isNotBlank() }?.let(::add)' not in lines[left_end]:
              left_end += 1
          if left_end >= len(lines):
              raise SystemExit('Could not bound left-neighbor prewarm block')
          del lines[left_index:left_end + 1]
          if left_index < len(lines) and not lines[left_index].strip():
              del lines[left_index]

          loop_index = next((i for i, line in enumerate(lines) if 'for (adjacentRowIndex in intArrayOf(rowIndex - 1, rowIndex + 1)) {' in line), None)
          if loop_index is None:
              raise SystemExit('Expected adjacent-row loop not found')
          balance = 0
          loop_end = None
          for i in range(loop_index, len(lines)):
              balance += lines[i].count('{') - lines[i].count('}')
              if balance == 0:
                  loop_end = i
                  break
          if loop_end is None:
              raise SystemExit('Could not bound adjacent-row loop')
          indent = lines[loop_index][:len(lines[loop_index]) - len(lines[loop_index].lstrip())]
          below_block = [
              indent + 'val belowRow = latestCarouselRows.getOrNull(rowIndex + 1)',
              indent + 'if (belowRow != null && belowRow.items.isNotEmpty()) {',
              indent + '    val rememberedIndex = (focusedItemByRow[belowRow.key] ?: 0)',
              indent + '        .coerceIn(0, belowRow.items.lastIndex)',
              indent + '    belowRow.items.getOrNull(rememberedIndex)?.heroPreview?.let {',
              indent + '        firstNonBlank(it.backdrop, it.imageUrl)',
              indent + '    }?.takeIf { it.isNotBlank() }?.let(::add)',
              indent + '}',
          ]
          lines[loop_index:loop_end + 1] = below_block

          path.write_text('\n'.join(lines) + '\n')
          PY

          git diff --check
          git diff -- app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt

      - name: Compile sideload Kotlin
        run: ./gradlew :app:compileSideloadKotlin

      - name: Commit source and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/adjust-hero-prewarm-v3.yml
          rm -f .github/workflows/adjust-hero-prewarm-v4.yml
          git add app/src/main/java/com/nuvio/tv/ui/screens/home/ModernHomeContent.kt .github/workflows/adjust-hero-prewarm-v3.yml .github/workflows/adjust-hero-prewarm-v4.yml
          git commit -m "Limit hero backdrop prewarm to right and below"
          git push origin HEAD:fix/readiness-gated-hero-backdrop
